# Configuración local del piloto. El runner copia esta carpeta a un directorio temporal.
project_id = "investment-tracker-ci"

[api]
port = 55421
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
port = 55422
shadow_port = 55420
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed_demo.sql"]

[studio]
enabled = false

[analytics]
enabled = false

[realtime]
enabled = false

[edge_runtime]
enabled = false

[local_smtp]
enabled = true
port = 55424

[auth]
site_url = "http://127.0.0.1:3100"
additional_redirect_urls = ["http://127.0.0.1:3100/auth/callback**"]
enable_signup = true

[auth.email]
enable_confirmations = false
